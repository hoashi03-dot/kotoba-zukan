<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ことばずかん">
<meta name="theme-color" content="#F3EDE1">
<title>ことばずかん</title>
<style>
  :root {
    --bg: #F3EDE1;
    --bar: #E9E1D2;
    --label: #6B5F52;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── モード切替（上）─────────────────────
     左「ことば」右「かず」。子どもが自分で行き来できるよう
     常に両方を同じ濃さで見せる。
     ────────────────────────────────────── */
  #modes {
    display: flex;
    gap: 2vmin;
    padding: 1.4vmin 2.6vmin;
    background: var(--bar);
  }

  .mode {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5vmin;
    min-height: 72px;
    border: none;
    border-radius: 1.6vmin;
    background: #FFFFFF;
    box-shadow: 0 0.4vmin 1vmin rgba(107, 95, 82, 0.14);
    font-family: inherit;
    -webkit-user-drag: none;
    cursor: pointer;
    transition: transform 150ms ease-out, background-color 150ms ease-out;
  }

  .mode .emoji {
    font-size: min(6vmin, 7.5vh);
    line-height: 1;
    font-family: "Apple Color Emoji", sans-serif;
    pointer-events: none;
  }

  .mode .name {
    font-size: min(3.6vmin, 4.4vh);
    font-weight: 600;
    color: var(--label);
    pointer-events: none;
  }

  .mode.active {
    background: var(--accent, #F7F1E6);
    box-shadow: none;
    transform: translateY(-0.6vmin);
  }

  /* ── カードのグリッド ───────────────────── */
  #grid {
    flex: 1;
    display: grid;
    gap: 2.6vmin;
    padding: 2.6vmin;
    min-height: 0;
  }

  /* minmax(0, 1fr) にしないと、行が中身より小さくならず画面からはみ出す */

  /* ことば: 6枚 */
  #grid.n6 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
  }

  /* かず: 10枚 */
  #grid.n10 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 1.8vmin;
    padding: 1.8vmin;
  }

  /* 縦向きに組み替える（子どもが iPad を回すため） */
  @media (orientation: portrait) {
    #grid.n6 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }
    #grid.n10 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
    }
    /* 縦向きは1枚あたりの高さが低いので、20個の丸が収まるよう縮める */
    #grid.n10 .numeral { font-size: min(8vmin, 7vh); }
    #grid.n10 .dots { gap: 0.7vmin; margin-top: 0.8vmin; }
    #grid.n10 .dot { width: 2vmin; height: 2vmin; }
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5vmin;
    padding: 1vmin;
    min-height: 0;
    overflow: hidden;
    border: none;
    border-radius: 4vmin;
    /* 背景と紛れないよう、色ではなく影で「押せる面」の輪郭を出す */
    background: var(--card, #F7F1E6);
    box-shadow: 0 0.5vmin 1.4vmin rgba(107, 95, 82, 0.16);
    font-family: inherit;
    -webkit-user-drag: none;
    cursor: pointer;
    transform-origin: center;
  }

  .card > * { pointer-events: none; }

  /* ことばカード */
  .card .emoji {
    font-size: min(22vmin, 26vh);
    line-height: 1.05;
    /* 絵文字を Apple 純正で出す（他フォントに落ちると絵柄が変わるため） */
    font-family: "Apple Color Emoji", sans-serif;
  }

  .card .name {
    font-size: min(4.4vmin, 5vh);
    font-weight: 600;
    color: var(--label);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  /* かずカード: 数字と、その数だけの丸 */
  .card .numeral {
    font-size: min(14vmin, 17vh);
    font-weight: 700;
    line-height: 1;
    color: #5A4A3A;
  }

  .dots {
    display: grid;
    grid-template-columns: repeat(5, auto); /* 5個ずつ並べて量を掴みやすくする */
    gap: 0.9vmin;
    justify-content: center;
    margin-top: 1.4vmin;
  }

  .dot {
    width: 2.6vmin;
    height: 2.6vmin;
    border-radius: 50%;
    background: rgba(90, 74, 58, 0.7);
  }

  /* 押した瞬間の跳ね。拡大時に隣へ潜り込まないよう前面へ出す */
  .card.pop, .tab.pop, .mode.pop {
    z-index: 1;
    animation: pop 420ms ease-out;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* 喋っている間だけ絵をゆっくり脈打たせ、音と絵を結び付ける */
  .card.talking .emoji,
  .card.talking .numeral {
    animation: talk 1.1s ease-in-out infinite;
  }

  @keyframes talk {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* 切替時にカードが順に現れる（自分が押した結果だと分かるように） */
  .card.enter {
    animation: enter 320ms ease-out backwards;
  }

  @keyframes enter {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ── グループのタブ（下）───────────────── */
  #tabs {
    display: flex;
    gap: 2vmin;
    padding: 1.6vmin 2.6vmin;
    /* 下端のホームバー領域から物理的に離す（こすって離脱するのを減らす） */
    margin-bottom: 20px;
    background: var(--bar);
  }

  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5vmin;
    min-height: 88px;
    border: none;
    /* カードとは形で区別する（丸みの浅い横長の帯） */
    border-radius: 1.6vmin;
    background: #FFFFFF;
    box-shadow: 0 0.4vmin 1vmin rgba(107, 95, 82, 0.14);
    font-family: inherit;
    -webkit-user-drag: none;
    cursor: pointer;
    transition: transform 150ms ease-out, background-color 150ms ease-out;
  }

  .tab > * { pointer-events: none; }

  .tab .emoji {
    font-size: min(7vmin, 9vh);
    line-height: 1;
    font-family: "Apple Color Emoji", sans-serif;
  }

  /* タブの文字はカードより控えめにして「主役ではない」ことを形で示す */
  .tab .name {
    font-size: min(3.2vmin, 4vh);
    font-weight: 600;
    color: var(--label);
    opacity: 0.85;
  }

  /* 選択状態は透明度で表さない（2〜3歳児は薄い＝壊れている と受け取るため） */
  .tab.active {
    background: var(--card, #F7F1E6);
    box-shadow: none;
    transform: translateY(0.6vmin);
  }
</style>
</head>
<body>

<header id="modes"></header>
<main id="grid"></main>
<nav id="tabs"></nav>

<script>
/* ──────────────────────────────────────────
   データ
   ことば: { e: 絵文字, n: "よみ" }。s を足すと読み上げだけ別表記にできる。
   かず  : { num: 数, s: "よみ" }。数字をそのまま読ませると
           4を「し」、7を「しち」と読むことがあるため、かなを明示する。

   絵文字を選ぶときの決まりごと:
   ・白や半透明が主体の絵は使わない（背景に溶けて2歳児には見えない）
   ・同じカテゴリ内で同系色・似た形を並べない
   ・タブやモードの絵文字は、カードの絵と重複させない
   ────────────────────────────────────────── */
const WORD_GROUPS = [
  {
    tabEmoji: '🐻', tabName: 'どうぶつ', color: '#F7D9CB',
    items: [
      { e: '🐶', n: 'いぬ' },
      { e: '🐱', n: 'ねこ' },
      { e: '🐘', n: 'ぞう' },
      { e: '🦁', n: 'らいおん', s: 'ライオン' },
      { e: '🐰', n: 'うさぎ' },
      { e: '🐟', n: 'さかな' },
    ],
  },
  {
    tabEmoji: '🍰', tabName: 'たべもの', color: '#F6E4B8',
    items: [
      { e: '🍎', n: 'りんご' },
      { e: '🍌', n: 'ばなな', s: 'バナナ' },
      { e: '🍞', n: 'ぱん', s: 'パン' },
      { e: '🍙', n: 'おにぎり' },
      { e: '🍓', n: 'いちご' },
      { e: '🍇', n: 'ぶどう' },
    ],
  },
  {
    tabEmoji: '🚁', tabName: 'のりもの', color: '#CDE4EC',
    items: [
      { e: '🚙', n: 'くるま' },
      { e: '🚌', n: 'ばす', s: 'バス' },
      { e: '🚆', n: 'でんしゃ' },
      { e: '🚒', n: 'しょうぼうしゃ' },
      { e: '✈️', n: 'ひこうき' },
      { e: '🚢', n: 'ふね' },
    ],
  },
];

const KANA = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう', 'じゅう'];

// 1〜20 を10個ずつ2つのグループにする
function numberItems(from, to) {
  const items = [];
  for (let n = from; n <= to; n++) {
    const kana = n <= 10 ? KANA[n] : (n === 20 ? 'にじゅう' : 'じゅう' + KANA[n - 10]);
    items.push({ num: n, s: kana });
  }
  return items;
}

const NUMBER_GROUPS = [
  { tabEmoji: '☝️', tabName: '1から10',  tabSpeech: 'いちからじゅう',       color: '#D8E7D0', items: numberItems(1, 10) },
  { tabEmoji: '✌️', tabName: '11から20', tabSpeech: 'じゅういちからにじゅう', color: '#E2DCF0', items: numberItems(11, 20) },
];

const MODES = [
  { emoji: '🧸', name: 'ことば', accent: '#F7D9CB', groups: WORD_GROUPS },
  { emoji: '🔢', name: 'かず',   accent: '#D8E7D0', groups: NUMBER_GROUPS },
];

const SPEECH_RATE = 0.85; // 2歳児向けに少しゆっくり。聞き取りにくければここを調整する。

/* ── 音声 ───────────────────────────────
   音声合成が無い端末でも、絵とアニメだけは必ず動くようにする。
   ここで例外を投げると描画処理まで止まり、白画面になるため全て握りつぶす。
   ────────────────────────────────────── */
const synth = window.speechSynthesis || null;
let jaVoice = null;
let currentUtterance = null;  // 発話中に GC されて音が切れるのを防ぐ
let speakingEl = null;
let unlocked = false;         // iOS: このページで発話が一度でも通ったか

function pickVoice() {
  if (!synth) return;
  try {
    const voices = synth.getVoices();
    jaVoice = voices.find(v => v.lang === 'ja-JP') ||
              voices.find(v => v.lang && v.lang.startsWith('ja')) || null;
  } catch (e) {
    jaVoice = null;
  }
}
pickVoice();
if (synth) synth.onvoiceschanged = pickVoice;

function speak(text, el) {
  if (!synth || !text) return;
  try {
    // 同じものを連打されても、鳴っている間は無視して最後まで聞かせる
    if (synth.speaking && speakingEl === el) return;
    // 無条件の cancel は iOS で発話キューを壊すため、必要なときだけ
    if (synth.speaking || synth.pending) synth.cancel();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = SPEECH_RATE;
    // 音声リストは読み込み後に差し替わることがあるため、発話のたびに取り直す
    pickVoice();
    if (jaVoice) u.voice = jaVoice;

    const done = () => {
      if (el) el.classList.remove('talking');
      if (speakingEl === el) speakingEl = null;
    };
    u.onstart = () => {
      unlocked = true;
      if (el) el.classList.add('talking');
    };
    u.onend = done;
    u.onerror = done;

    currentUtterance = u;
    speakingEl = el;
    synth.speak(u);
  } catch (e) {
    /* 音が出なくてもアプリは動き続ける */
  }
}

/* 二重発火の抑止。解禁前は click での再試行を通したいので抑止しない */
let lastEl = null;
let lastAt = 0;
function requestSpeak(text, el) {
  const now = Date.now();
  if (unlocked && el === lastEl && now - lastAt < 500) return;
  lastEl = el;
  lastAt = now;
  speak(text, el);
}

/* 読み上げ中に離脱すると iOS の音声が固まるため、状態を戻しておく */
function resetSpeech() {
  if (!synth) return;
  try { synth.cancel(); } catch (e) { /* noop */ }
  if (speakingEl) speakingEl.classList.remove('talking');
  speakingEl = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) resetSpeech();
});
window.addEventListener('pagehide', resetSpeech);

/* 読み上げる文字列。ことばは かな、かずは 数のよみ */
function speechOf(item) {
  return item.s || item.n || '';
}

/* ── カード ─────────────────────────────
   カードは枚数が変わるときだけ作り直す。同じモードの中では
   中身を差し替えるだけにする（作り直すと、押している最中に
   カードが消えて発話が失われる）。
   ────────────────────────────────────── */
const modesEl = document.getElementById('modes');
const gridEl = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const cards = [];
let armedCard = null; // いま指が触れているカード

function pop(el) {
  el.classList.remove('pop');
  void el.offsetWidth; // 連打でもアニメを頭から出し直す
  el.classList.add('pop');
}

function createCard() {
  const card = document.createElement('button');
  card.className = 'card';

  // 見た目の反応は指が触れた瞬間に返す（2歳児には即時性が要る）
  card.addEventListener('pointerdown', (e) => {
    armedCard = card;
    // 指がカードの外へずれても pointerup を受け取れるようにする
    try { card.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    pop(card);
  });

  // 発話は指を離したときに出す。pointerup なら指がずれても取りこぼさない。
  card.addEventListener('pointerup', () => {
    if (armedCard !== card) return;
    armedCard = null;
    requestSpeak(speechOf(card._item), card);
  });

  card.addEventListener('pointercancel', () => { armedCard = null; });

  // iOS はページ最初の発話を click 系の操作でしか解禁しない。
  // まだ一度も鳴っていない間だけ、click で鳴らし直す。
  card.addEventListener('click', () => {
    if (!unlocked) requestSpeak(speechOf(card._item), card);
  });

  return card;
}

function ensureCards(count) {
  if (cards.length === count) return;
  armedCard = null;
  gridEl.innerHTML = '';
  cards.length = 0;
  for (let i = 0; i < count; i++) {
    const card = createCard();
    cards.push(card);
    gridEl.append(card);
  }
  gridEl.className = 'n' + count;
}

function fillCard(card, item, color) {
  card._item = item;
  card.style.setProperty('--card', color);
  card.innerHTML = '';

  if (item.num !== undefined) {
    const numeral = document.createElement('span');
    numeral.className = 'numeral';
    numeral.textContent = item.num;

    const dots = document.createElement('span');
    dots.className = 'dots';
    for (let i = 0; i < item.num; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      dots.append(dot);
    }
    card.append(numeral, dots);
  } else {
    const emoji = document.createElement('span');
    emoji.className = 'emoji';
    emoji.textContent = item.e;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = item.n;
    card.append(emoji, name);
  }
}

function applyGroup(group) {
  ensureCards(group.items.length);
  cards.forEach((card, i) => {
    fillCard(card, group.items[i], group.color);

    // 順に現れる演出。切替のたびに頭から流し直す
    card.classList.remove('enter', 'talking');
    void card.offsetWidth;
    card.style.animationDelay = (i * 45) + 'ms';
    card.classList.add('enter');
  });
}

/* ── モードとタブ ───────────────────────── */
let modeIndex = -1;
let groupIndex = -1;

function selectGroup(index, speakName) {
  const groups = MODES[modeIndex].groups;
  if (index === groupIndex) return; // 連打で作り直さない
  groupIndex = index;

  const group = groups[index];
  applyGroup(group);

  [...tabsEl.children].forEach((tab, i) => {
    tab.classList.toggle('active', i === index);
    tab.style.setProperty('--card', groups[i].color);
  });

  if (speakName) {
    const tab = tabsEl.children[index];
    requestSpeak(group.tabSpeech || group.tabName, tab);
  }
}

function renderTabs() {
  const groups = MODES[modeIndex].groups;
  tabsEl.innerHTML = '';
  groups.forEach((group, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab';

    const emoji = document.createElement('span');
    emoji.className = 'emoji';
    emoji.textContent = group.tabEmoji;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = group.tabName;

    tab.append(emoji, name);

    // カードと同じく「押したら鳴る」を守る。押した瞬間ではなく離したときに確定。
    tab.addEventListener('click', () => {
      pop(tab);
      selectGroup(i, true);
    });

    tabsEl.append(tab);
  });
}

function selectMode(index, speakName) {
  if (index === modeIndex) return;
  modeIndex = index;
  groupIndex = -1;

  const mode = MODES[index];
  [...modesEl.children].forEach((el, i) => {
    el.classList.toggle('active', i === index);
    el.style.setProperty('--accent', MODES[i].accent);
  });

  renderTabs();
  selectGroup(0, false);

  if (speakName) requestSpeak(mode.name, modesEl.children[index]);
}

function renderModes() {
  MODES.forEach((mode, i) => {
    const btn = document.createElement('button');
    btn.className = 'mode';

    const emoji = document.createElement('span');
    emoji.className = 'emoji';
    emoji.textContent = mode.emoji;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = mode.name;

    btn.append(emoji, name);
    btn.addEventListener('click', () => {
      pop(btn);
      selectMode(i, true);
    });

    modesEl.append(btn);
  });
}

renderModes();
selectMode(0, false);
</script>

</body>
</html>
