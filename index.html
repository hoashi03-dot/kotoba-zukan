<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ことばずかん">
<meta name="theme-color" content="#E9E1D2">
<title>ことばずかん</title>
<style>
  :root {
    --bg: #F3EDE1;
    --bar: #E9E1D2;
    --label: #6B5F52;
    --dot: #E2714B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    /* 上下の safe-area にはバーと同じ色を敷く（帯が浮いて見えないように） */
    background: var(--bar);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── モード切替（上）─────────────────────
     左「ことば」右「かず」。子どもが自分で行き来できるよう
     常に両方を同じ濃さで見せる。
     ────────────────────────────────────── */
  #modes {
    display: flex;
    gap: 2vmin;
    padding: 1.4vmin 2.6vmin;
    /* 上端は下方向スワイプでコントロールセンターが開くため、指を離す */
    margin-top: 20px;
    background: var(--bar);
  }

  /* touch-action は継承されない。ボタン側にも指定しないと、指を滑らせた
     ときに iOS がジェスチャと解釈して pointercancel を投げ、音が鳴らない */
  .mode, .tab, .card { touch-action: none; }

  .mode, .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5vmin;
    border: none;
    /* カードとは形で区別する（丸みの浅い横長の帯） */
    border-radius: 1.6vmin;
    /* 非選択も色を持たせる。ひらがなの10タブは文字が読めない子には
       見分けがつかず、色だけが「さっきの場所」に戻る手がかりになる */
    background: var(--accent, #FFFFFF);
    box-shadow: 0 0.4vmin 1vmin rgba(107, 95, 82, 0.14);
    font-family: inherit;
    -webkit-user-drag: none;
    cursor: pointer;
    transition: transform 150ms ease-out, box-shadow 150ms ease-out;
  }

  .mode > *, .tab > * { pointer-events: none; }

  .mode { min-height: 60px; }
  .tab  { min-height: 72px; }

  /* ひらがなモードでは絵文字ではなく文字が入るので、日本語書体まで落ちるようにする */
  .mode .emoji, .tab .emoji {
    line-height: 1;
    font-family: "Apple Color Emoji", "Hiragino Maru Gothic ProN", sans-serif;
    font-weight: 700;
    color: var(--label);
  }

  .mode .emoji { font-size: min(5.4vmin, 6.6vh); }
  .tab  .emoji { font-size: min(6.4vmin, 8vh); }

  .mode .name, .tab .name {
    font-weight: 600;
    color: var(--label);
  }

  .mode .name { font-size: min(3.6vmin, 4.4vh); }
  .tab  .name { font-size: min(3.2vmin, 4vh); opacity: 0.85; }

  /* 選択状態は透明度で表さない（2〜3歳児は薄い＝壊れている と受け取るため）。
     モードもタブも「選ばれたものは沈み、内側に縁がつく」で統一する。 */
  .mode.active, .tab.active {
    box-shadow: inset 0 0 0 0.7vmin rgba(107, 95, 82, 0.32);
    transform: translateY(0.6vmin);
  }

  /* ── カードのグリッド ─────────────────────
     列と行は JS がカードの枚数から決める（CSS 側に枚数を書かない）。
     minmax(0, 1fr) にしないと、行が中身より小さくならず画面からはみ出す。
     ────────────────────────────────────── */
  #grid {
    flex: 1;
    display: grid;
    gap: 2.6vmin;
    padding: 2.6vmin;
    min-height: 0;
    background: var(--bg);
  }

  .card {
    position: relative;
    /* 枚数が3枚の行（や・わ）でカードだけ極端に大きくならないよう頭を抑える。
       行を移るたびに大きさが変わると、子どもには別のものに見える */
    width: 100%;
    height: 100%;
    max-width: 52vmin;
    max-height: 46vmin;
    justify-self: center;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5vmin;
    padding: 1vmin;
    min-height: 0;
    overflow: hidden;
    border: none;
    border-radius: 4vmin;
    /* 背景と紛れないよう、色ではなく影で「押せる面」の輪郭を出す */
    background: var(--card, #F7F1E6);
    box-shadow: 0 0.5vmin 1.4vmin rgba(107, 95, 82, 0.16);
    font-family: inherit;
    -webkit-user-drag: none;
    cursor: pointer;
    transform-origin: center;
  }

  .card > * { pointer-events: none; }

  /* ことばカード */
  .card .emoji {
    font-size: min(22vmin, 26vh);
    line-height: 1.05;
    /* 絵文字を Apple 純正で出す（他フォントに落ちると絵柄が変わるため） */
    font-family: "Apple Color Emoji", sans-serif;
  }

  .card .name {
    font-size: min(4.4vmin, 5vh);
    font-weight: 600;
    color: var(--label);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  /* かずカード: 数字は添え物、意味を運ぶのは丸のほう。
     この年齢に「3」という記号は届かないので、丸を主役として大きく描く。 */
  .card .numeral {
    font-size: min(9vmin, 11vh);
    font-weight: 700;
    line-height: 1;
    color: var(--label);
  }

  .dots {
    display: grid;
    grid-template-columns: repeat(5, auto); /* 5個ずつ並べて量を掴みやすくする */
    gap: 1.2vmin;
    justify-content: center;
    margin: 1vmin 0;
  }

  .dot {
    width: 5vmin;
    height: 5vmin;
    border-radius: 50%;
    /* 数字と別の色にして「なにか」と「いくつか」を分ける */
    background: var(--dot);
  }

  /* ひらがなカード: 文字が主役、絵はその音を思い出すための鍵 */
  .card .kana {
    font-size: min(12vmin, 15vh);
    /* 丸ゴシックは1ウェイトしかなく、700 にすると合成ボールドで字形が崩れる。
       ひらがなの形に触れさせるモードなので、素の字形のまま出す */
    font-weight: 500;
    line-height: 1;
    color: var(--label);
    margin-bottom: 0.8vmin;
  }

  /* を・ん は絵が無いので、文字そのものを主役として大きく出す
     （中央に小さく1文字だけだと「作りかけ」に見える） */
  .card.kana-only .kana {
    font-size: min(24vmin, 28vh);
    margin-bottom: 0;
  }

  .card .pic {
    font-size: min(9vmin, 10.5vh);
    line-height: 1.1;
    font-family: "Apple Color Emoji", sans-serif;
  }

  /* 1画面の枚数が増えたときは中身を縮める（将来グループを増やしたとき用） */
  #grid.dense .emoji   { font-size: min(15vmin, 18vh); }
  #grid.dense .kana    { font-size: min(11vmin, 14vh); }
  #grid.dense .pic     { font-size: min(6vmin, 8vh); }
  #grid.dense .numeral { font-size: min(7vmin, 8vh); }
  #grid.dense .dots    { gap: 0.8vmin; margin: 0.6vmin 0; }
  #grid.dense .dot     { width: 3vmin; height: 3vmin; }
  #grid.dense .name    { font-size: min(3.4vmin, 4vh); }

  /* 切替時にカードが順に現れる（自分が押した結果だと分かるように）。
     遅延は変数で渡す。インラインの animation-delay にすると跳ねにも効いてしまう。 */
  .card.enter {
    animation: enter 320ms ease-out backwards;
    animation-delay: var(--enter-delay, 0ms);
  }

  @keyframes enter {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 押した瞬間の跳ね。enter と同じ詳細度なので、必ず後ろに置いて勝たせる。
     拡大時に隣へ潜り込まないよう前面へ出す。 */
  .card.pop, .tab.pop, .mode.pop {
    z-index: 1;
    animation: pop 420ms ease-out;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* 喋っている間だけゆっくり脈打たせ、音と絵を結び付ける。
     カードの種類が増えたら、その主役要素をここに必ず足すこと。
     （音が出ないときは脈動もしないので、親が異常に気づける手がかりになる） */
  .card.talking .emoji,
  .card.talking .numeral,
  .card.talking .dots,
  .card.talking .kana,
  .mode.talking .emoji,
  .tab.talking .emoji {
    animation: talk 1.1s ease-in-out infinite;
  }

  @keyframes talk {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ── グループのタブ（下）───────────────── */
  #tabs {
    display: flex;
    gap: 2vmin;
    padding: 1.6vmin 2.6vmin;
    /* 下端のホームバー領域から物理的に離す（こすって離脱するのを減らす） */
    margin-bottom: 20px;
    background: var(--bar);
  }

  /* タブが多いとき（ひらがなの10行）、縦向きでは1つ約62pxまで痩せて
     2〜3歳の指では狙えない。2段に折り返して1つの幅を倍に取る */
  @media (orientation: portrait) {
    #tabs.many { flex-wrap: wrap; }
    #tabs.many .tab { flex: 1 1 17%; min-height: 62px; }
  }
</style>
</head>
<body>

<header id="modes"></header>
<main id="grid"></main>
<nav id="tabs"></nav>

<script>
/* ──────────────────────────────────────────
   データ
   ことば: { e: 絵文字, n: "よみ" }。s を足すと読み上げだけ別表記にできる。
           ひらがなだけの長い語は音声合成が区切りを誤ることがあるので
           （例「しょうぼうしゃ」→「しょうぼんしや」）、s に漢字を入れる。
   かず  : { num: 数, s: "よみ" }。数字をそのまま読ませると
           4を「し」、7を「しち」と読むことがあるため、かなを明示する。

   絵文字を選ぶときの決まりごと:
   ・白や半透明が主体の絵は使わない（背景に溶けて2歳児には見えない）
   ・同じグループ内で同系色・似た形を並べない
   ・同時に画面に出る絵は重複させない（モード・タブ・カードの全部を見る）
   ・かずモードでは、量に読める絵（指の本数など）をタブに使わない
   ────────────────────────────────────────── */
const WORD_GROUPS = [
  {
    tabEmoji: '🐾', tabName: 'どうぶつ', color: '#F7D9CB',
    items: [
      { e: '🐶', n: 'いぬ' },
      { e: '🐱', n: 'ねこ' },
      { e: '🐘', n: 'ぞう' },
      { e: '🦁', n: 'らいおん', s: 'ライオン' },
      { e: '🐰', n: 'うさぎ' },
      { e: '🐟', n: 'さかな' },
    ],
  },
  {
    tabEmoji: '🍰', tabName: 'たべもの', color: '#F6E4B8',
    items: [
      { e: '🍎', n: 'りんご' },
      { e: '🍌', n: 'ばなな', s: 'バナナ' },
      { e: '🍞', n: 'ぱん', s: 'パン' },
      { e: '🍙', n: 'おにぎり' },
      { e: '🍓', n: 'いちご' },
      { e: '🍇', n: 'ぶどう' },
    ],
  },
  {
    tabEmoji: '🚁', tabName: 'のりもの', color: '#CDE4EC',
    items: [
      { e: '🚙', n: 'くるま' },
      { e: '🚌', n: 'ばす', s: 'バス' },
      { e: '🚆', n: 'でんしゃ' },
      { e: '🚒', n: 'しょうぼうしゃ', s: '消防車' },
      { e: '✈️', n: 'ひこうき' },
      { e: '🚢', n: 'ふね' },
    ],
  },
];

const KANA = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう', 'じゅう'];

function numberItems(from, to) {
  const items = [];
  for (let n = from; n <= to; n++) {
    const kana = n <= 10 ? KANA[n] : (n === 20 ? 'にじゅう' : 'じゅう' + KANA[n - 10]);
    items.push({ type: 'num', num: n, n: kana, s: kana });
  }
  return items;
}

/* 2〜3歳が量として掴めるのは 1〜5 くらいまで。まず10までに絞り、
   楽しめるようになったら { ... numberItems(11, 20) } を1行足す。 */
const NUMBER_GROUPS = [
  { tabEmoji: '🟢', tabName: '1から5',  tabSpeech: 'いちからご',      color: '#D8E7D0', items: numberItems(1, 5) },
  { tabEmoji: '🟣', tabName: '6から10', tabSpeech: 'ろくからじゅう',  color: '#E2DCF0', items: numberItems(6, 10) },
];

/* ひらがな 46文字。行ごとに1画面。
   { k: 文字, e: 絵文字, w: その音で始まる言葉, ws: 読み上げ用の表記 }
   読み上げは「ア、あり」のように、文字の音のあとに言葉を続ける。
   単独のひらがなはカタカナに直して読ませる（「は」を「わ」と読まれないため）。
   表示は必ずひらがな（ひらがなを覚える画面なので）。外来語は ws に
   カタカナを入れて、読み上げだけ正しいアクセントにする。
   る・を・ん は2〜3歳が知っている語が無いので文字だけにする。 */
const HIRA_ROWS = [
  { color: '#F7D9CB', chars: [
    { k: 'あ', e: '🐜', w: 'あり' },
    { k: 'い', e: '🐶', w: 'いぬ' },
    { k: 'う', e: '🐴', w: 'うま' },
    { k: 'え', e: '✏️', w: 'えんぴつ' },
    { k: 'お', e: '🍙', w: 'おにぎり' },
  ] },
  { color: '#F6E4B8', chars: [
    { k: 'か', e: '🦀', w: 'かに' },
    { k: 'き', e: '🦒', w: 'きりん' },
    { k: 'く', e: '🚙', w: 'くるま' },
    { k: 'け', e: '🍰', w: 'けーき', ws: 'ケーキ' },
    { k: 'こ', e: '🎏', w: 'こいのぼり' },
  ] },
  { color: '#D8E7D0', chars: [
    { k: 'さ', e: '🐟', w: 'さかな' },
    { k: 'し', e: '🚄', w: 'しんかんせん' },
    { k: 'す', e: '🍉', w: 'すいか' },
    { k: 'せ', e: '🧼', w: 'せっけん' },
    { k: 'そ', e: '🛷', w: 'そり' },
  ] },
  { color: '#CDE4EC', chars: [
    { k: 'た', e: '🥁', w: 'たいこ' },
    { k: 'ち', e: '🧀', w: 'ちーず', ws: 'チーズ' },
    { k: 'つ', e: '🌙', w: 'つき' },
    { k: 'て', e: '🐞', w: 'てんとうむし' },
    { k: 'と', e: '🐯', w: 'とら' },
  ] },
  { color: '#E2DCF0', chars: [
    { k: 'な', e: '🍆', w: 'なす' },
    { k: 'に', e: '🌈', w: 'にじ' },
    { k: 'ぬ', e: '🧸', w: 'ぬいぐるみ' },
    { k: 'ね', e: '🐱', w: 'ねこ' },
    { k: 'の', e: '📓', w: 'のーと', ws: 'ノート' },
  ] },
  { color: '#F3D5DE', chars: [
    { k: 'は', e: '🌸', w: 'はな' },
    { k: 'ひ', e: '✈️', w: 'ひこうき' },
    { k: 'ふ', e: '🚢', w: 'ふね' },
    { k: 'へ', e: '🐍', w: 'へび' },
    { k: 'ほ', e: '📕', w: 'ほん' },
  ] },
  { color: '#E7E2CE', chars: [
    { k: 'ま', e: '🧣', w: 'まふらー', ws: 'マフラー' },
    { k: 'み', e: '🍊', w: 'みかん' },
    { k: 'む', e: '🐛', w: 'むし' },
    { k: 'め', e: '👓', w: 'めがね' },
    { k: 'も', e: '🍑', w: 'もも' },
  ] },
  { color: '#D6E3F0', chars: [
    { k: 'や', e: '⛰️', w: 'やま' },
    { k: 'ゆ', e: '🎡', w: 'ゆうえんち' },
    { k: 'よ', e: '👕', w: 'ようふく' },
  ] },
  { color: '#F0DCC8', chars: [
    { k: 'ら', e: '🦁', w: 'らいおん', ws: 'ライオン' },
    { k: 'り', e: '🍎', w: 'りんご' },
    { k: 'る', e: null,  w: null },  // 2〜3歳が知っている「る」で始まる語が無いので文字だけ
    { k: 'れ', e: '🍋', w: 'れもん', ws: 'レモン' },
    { k: 'ろ', e: '🚀', w: 'ろけっと', ws: 'ロケット' },
  ] },
  { color: '#DDE7DE', chars: [
    { k: 'わ', e: '🐊', w: 'わに' },
    { k: 'を' },
    { k: 'ん' },
  ] },
];

// ひらがな→カタカナ（文字コードが 0x60 ずれているだけ）。
// 1文字ずつ変換し、範囲外（長音符など）はそのまま通す。
// 先頭1文字だけの変換にすると、拗音を足したとき「きゃ」が「キゃ」になる。
function toKatakana(str) {
  return String(str).replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}

const HIRA_GROUPS = HIRA_ROWS.map(row => ({
  tabEmoji: row.chars[0].k,
  tabName: '',
  tabSpeech: toKatakana(row.chars[0].k),
  color: row.color,
  items: row.chars.map(c => ({
    type: 'kana',
    kana: c.k,
    e: c.e,
    n: c.w || '',
    s: c.w ? toKatakana(c.k) + '、' + (c.ws || c.w) : toKatakana(c.k),
  })),
}));

const MODES = [
  { emoji: '🐤', name: 'ことば',   groups: WORD_GROUPS,   lastGroup: 0 },
  { emoji: '✋', name: 'かず',     groups: NUMBER_GROUPS, lastGroup: 0 },
  // アイコンに「あ」を使うと、モード・タブ・カードの3箇所に同じ字が並び、
  // どれを押しても違うことが起きる状態になるため絵文字にする
  { emoji: '🖍️', name: 'ひらがな', groups: HIRA_GROUPS, lastGroup: 0 },
];

const SPEECH_RATE = 0.85; // 2歳児向けに少しゆっくり。聞き取りにくければここを調整する。

/* ── 音声 ───────────────────────────────
   音声合成が無い端末でも、絵とアニメだけは必ず動くようにする。
   ここで例外を投げると描画処理まで止まり、白画面になるため全て握りつぶす。
   ────────────────────────────────────── */
const synth = window.speechSynthesis || null;
let jaVoice = null;
let currentUtterance = null;  // 発話中に GC されて音が切れるのを防ぐ
let speakingEl = null;
let unlocked = false;         // iOS: このページで発話が一度でも通ったか

function pickVoice() {
  if (!synth) return;
  try {
    const voices = synth.getVoices();
    jaVoice = voices.find(v => v.lang === 'ja-JP') ||
              voices.find(v => v.lang && v.lang.startsWith('ja')) || null;
  } catch (e) {
    jaVoice = null;
  }
}
pickVoice();
if (synth) synth.onvoiceschanged = pickVoice;

function speak(text, el) {
  if (!synth || !text) return;
  try {
    // 同じものを連打されても、鳴っている間は無視して最後まで聞かせる
    if (synth.speaking && speakingEl === el) return;
    // 無条件の cancel は iOS で発話キューを壊すため、必要なときだけ
    if (synth.speaking || synth.pending) synth.cancel();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = SPEECH_RATE;
    // 音声リストは読み込み後に差し替わることがあるため、発話のたびに取り直す
    pickVoice();
    if (jaVoice) u.voice = jaVoice;

    const done = () => {
      if (el) el.classList.remove('talking');
      if (speakingEl === el) speakingEl = null;
    };
    u.onstart = () => {
      unlocked = true;
      if (el) el.classList.add('talking');
    };
    u.onend = done;
    u.onerror = done;

    currentUtterance = u;
    speakingEl = el;
    synth.speak(u);
  } catch (e) {
    /* 音が出なくてもアプリは動き続ける */
  }
}

/* 連打の抑止。要素をまたいだ交互連打でも cancel→speak が連続しないよう、
   要素に依らない最小間隔も設ける（音声エンジンが止まる条件を避ける）。 */
let lastEl = null;
let lastAt = 0;
function requestSpeak(text, el) {
  const now = Date.now();
  if (now - lastAt < 150) return;                              // 交互連打
  if (unlocked && el === lastEl && now - lastAt < 500) return; // 同じものの連打
  lastEl = el;
  lastAt = now;
  speak(text, el);
}

/* 読み上げ中に離脱すると iOS の音声が固まるため、状態を戻しておく */
function resetSpeech() {
  if (!synth) return;
  try { synth.cancel(); } catch (e) { /* noop */ }
  if (speakingEl) speakingEl.classList.remove('talking');
  speakingEl = null;
  lastEl = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) resetSpeech();
});
window.addEventListener('pagehide', resetSpeech);
window.addEventListener('pageshow', (e) => {
  // 復帰時は音声セッションが切れていることがあるので、解禁からやり直せるようにする
  if (e.persisted) unlocked = false;
});

/* ── 押下の扱い（カード・タブ・モードで共通）──
   ・見た目は指が触れた瞬間に返す（2歳児には即時性が要る）
   ・確定は指を離したとき。pointerup なら指がずれても取りこぼさない
   ・iOS はページ最初の発話を click 系でしか解禁しないため、
     まだ鳴っていないときだけ click で鳴らし直す
   ────────────────────────────────────── */
const modesEl = document.getElementById('modes');
const gridEl = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const cards = [];
let armedEl = null; // いま指が触れている要素

function pop(el) {
  el.classList.remove('pop');
  void el.offsetWidth; // 連打でもアニメを頭から出し直す
  el.classList.add('pop');
}

function bindPress(el, onPress) {
  el.addEventListener('pointerdown', (e) => {
    armedEl = el;
    // 指が要素の外へずれても pointerup を受け取れるようにする
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    pop(el);
  });

  el.addEventListener('pointerup', () => {
    if (armedEl !== el) return;
    armedEl = null;
    onPress();
  });

  el.addEventListener('pointercancel', () => {
    if (armedEl === el) armedEl = null;
  });

  // pop を外さないと、次にこの要素へ付けるアニメーション（出現演出）が
  // 同じ詳細度の pop に負けて再生されなくなる
  el.addEventListener('animationend', (e) => {
    if (e.animationName === 'pop') el.classList.remove('pop');
  });

  el.addEventListener('click', () => {
    if (unlocked) return;
    // pointerup 側の発話が動いているなら、重ねて cancel を呼ばない
    if (synth && (synth.speaking || synth.pending)) return;
    onPress();
  });
}

/* ── カード ─────────────────────────────
   カードは枚数が変わるときだけ作り直す。同じ枚数のまま中身を
   差し替えるときも、押している最中なら押下は無効にする
   （押した絵と鳴る音が食い違わないように）。
   ────────────────────────────────────── */
function createCard() {
  const card = document.createElement('button');
  card.className = 'card';
  card.addEventListener('animationend', (e) => {
    // enter を残すと、次に押したときの跳ねが出なくなる
    if (e.animationName === 'enter') card.classList.remove('enter');
  });
  bindPress(card, () => requestSpeak(card._item && (card._item.s || card._item.n), card));
  return card;
}

const portraitMQ = window.matchMedia('(orientation: portrait)');

function layoutGrid(count) {
  // 横向きは2段、縦向きは2列。枚数から機械的に決める（CSSに枚数を書かない）
  const cols = portraitMQ.matches ? 2 : Math.ceil(count / 2);
  const rows = Math.ceil(count / cols);
  gridEl.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
  gridEl.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
  gridEl.classList.toggle('dense', count >= 8); // 1画面が増えたら中身を縮める
}

function ensureCards(count) {
  if (cards.length !== count) {
    armedEl = null;
    gridEl.innerHTML = '';
    cards.length = 0;
    for (let i = 0; i < count; i++) {
      const card = createCard();
      cards.push(card);
      gridEl.append(card);
    }
  }
  layoutGrid(count);
}

function fillCard(card, item, color) {
  card._item = item;
  card.style.setProperty('--card', color);
  card.innerHTML = '';
  card.classList.toggle('kana-only', item.type === 'kana' && !item.e);

  if (item.type === 'kana') {
    const kana = document.createElement('span');
    kana.className = 'kana';
    kana.textContent = item.kana;
    card.append(kana);

    // を・ん には、その音で始まる言葉が無いので文字だけを出す
    if (item.e) {
      const pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = item.e;
      card.append(pic);
    }
    if (item.n) {
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.n;
      card.append(name);
    }
  } else if (item.type === 'num') {
    const numeral = document.createElement('span');
    numeral.className = 'numeral';
    numeral.textContent = item.num;

    const dots = document.createElement('span');
    dots.className = 'dots';
    for (let i = 0; i < item.num; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      dots.append(dot);
    }

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = item.n;

    card.append(numeral, dots, name);
  } else {
    const emoji = document.createElement('span');
    emoji.className = 'emoji';
    emoji.textContent = item.e;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = item.n;

    card.append(emoji, name);
  }
}

function applyGroup(group) {
  armedEl = null; // 中身が変わるので、押しかけの指は無効にする
  // カードは使い回すため、中身が変われば「同じものの連打」判定を捨てる。
  // 残しておくと、行を移った直後に同じ位置を押したとき無音になる。
  lastEl = null;
  speakingEl = null;
  ensureCards(group.items.length);
  cards.forEach((card, i) => {
    fillCard(card, group.items[i], group.color);

    // 順に現れる演出。切替のたびに頭から流し直す
    card.classList.remove('enter', 'talking');
    void card.offsetWidth;
    card.style.setProperty('--enter-delay', (i * 45) + 'ms');
    card.classList.add('enter');
  });
}

/* ── モードとタブ ─────────────────────────
   「押したら鳴る」に例外を作らないため、選択済みのものを
   押したときも必ず読み上げる（描画のやり直しだけを省く）。
   ────────────────────────────────────── */
let modeIndex = -1;
let groupIndex = -1;

function selectGroup(index, speakName) {
  const mode = MODES[modeIndex];
  // データを減らしたときに、保持していた位置が無くなっていても壊れないように
  if (!mode.groups[index]) index = 0;
  const group = mode.groups[index];

  if (speakName) requestSpeak(group.tabSpeech || group.tabName, tabsEl.children[index]);
  if (index === groupIndex) return;

  groupIndex = index;
  mode.lastGroup = index;
  applyGroup(group);

  [...tabsEl.children].forEach((tab, i) => {
    tab.classList.toggle('active', i === index);
    tab.style.setProperty('--accent', mode.groups[i].color);
  });
  // いまいる場所を色でも示す（上下で色が食い違わないように）
  modesEl.children[modeIndex].style.setProperty('--accent', group.color);
}

function renderTabs() {
  const groups = MODES[modeIndex].groups;
  tabsEl.innerHTML = '';
  tabsEl.classList.toggle('many', groups.length > 5); // 縦向きで2段に折り返す
  groups.forEach((group, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab';

    const emoji = document.createElement('span');
    emoji.className = 'emoji';
    emoji.textContent = group.tabEmoji;

    tab.append(emoji);

    // ひらがなモードのタブは文字だけ（10個並ぶので名前を出す余地がない）
    if (group.tabName) {
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = group.tabName;
      tab.append(name);
    }

    bindPress(tab, () => selectGroup(i, true));
    tabsEl.append(tab);
  });
}

function selectMode(index, speakName) {
  const mode = MODES[index];

  if (speakName) requestSpeak(mode.name, modesEl.children[index]);
  if (index === modeIndex) return;

  modeIndex = index;
  groupIndex = -1;

  [...modesEl.children].forEach((el, i) => {
    el.classList.toggle('active', i === index);
    // 選んでいないモードは色を持たない（選択中の1つだけを色で示す）
    if (i !== index) el.style.removeProperty('--accent');
  });

  renderTabs();
  selectGroup(mode.lastGroup, false); // 戻ってきたら前に見ていたグループに戻す
}

function renderModes() {
  MODES.forEach((mode, i) => {
    const btn = document.createElement('button');
    btn.className = 'mode';

    const emoji = document.createElement('span');
    emoji.className = 'emoji';
    emoji.textContent = mode.emoji;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = mode.name;

    btn.append(emoji, name);
    bindPress(btn, () => selectMode(i, true));
    modesEl.append(btn);
  });
}

// 画面を回したとき・分割表示で幅が変わったときは列の組み方が変わる
const relayout = () => { if (cards.length) layoutGrid(cards.length); };
window.addEventListener('orientationchange', relayout);
window.addEventListener('resize', relayout);
portraitMQ.addEventListener('change', relayout);

renderModes();
selectMode(0, false);
</script>

</body>
</html>
