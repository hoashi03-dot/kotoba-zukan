<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おとのしんだん</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    background: #fff;
    color: #222;
  }
  h2 { font-size: 18px; margin: 20px 0 8px; }
  button {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 8px 0;
    font-size: 20px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: #2F6FEB;
    color: #fff;
  }
  button.alt { background: #1F9D55; }
  button.beep { background: #B5551F; }
  #env, #log {
    background: #F3F3F3;
    border-radius: 10px;
    padding: 12px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #log { min-height: 6em; }
</style>
</head>
<body>

<h2>1. 環境</h2>
<div id="env">読み取り中…</div>

<h2>2. テスト（上から順に押す）</h2>
<button id="btnBeep" class="beep">A ビープ音を鳴らす</button>
<button id="btnPlain" class="alt">B 「てすと」と読む（cancelなし）</button>
<button id="btnCancel">C 「てすと」と読む（cancelあり＝本番と同じ）</button>

<h2>3. どのイベントなら鳴るか</h2>
<button id="btnPointer" class="alt">D pointerdown で読む（本番と同じ）</button>
<button id="btnClick" class="alt">E click で読む</button>
<button id="btnTouchend" class="alt">F touchend で読む</button>

<h2>4. 結果ログ</h2>
<div id="log">（まだ何も押していません）</div>

<script>
const envEl = document.getElementById('env');
const logEl = document.getElementById('log');
let lines = [];

function log(msg) {
  lines.push(new Date().toLocaleTimeString('ja-JP') + '  ' + msg);
  logEl.textContent = lines.join('\n');
}

/* ── 環境の読み取り ───────────────────── */
function renderEnv() {
  const voices = speechSynthesis.getVoices();
  const ja = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
  envEl.textContent = [
    'standalone(ホーム画面起動): ' + (window.navigator.standalone === true ? 'はい' : 'いいえ'),
    'speechSynthesis: ' + ('speechSynthesis' in window ? 'あり' : 'なし'),
    'voices 総数: ' + voices.length,
    '日本語voice: ' + (ja.length ? ja.map(v => v.name + '(' + v.lang + ')').join(', ') : 'なし'),
    'speaking: ' + speechSynthesis.speaking + ' / paused: ' + speechSynthesis.paused,
    'UA: ' + navigator.userAgent,
  ].join('\n');
}
renderEnv();
speechSynthesis.onvoiceschanged = () => { log('voiceschanged 発火'); renderEnv(); };

/* ── A: ビープ（音声合成を通さず音が出るか）─── */
document.getElementById('btnBeep').addEventListener('click', () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    log('AudioContext state=' + ctx.state);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.2;
    osc.frequency.value = 660;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
    log('A: ビープ発音を要求した');
  } catch (e) {
    log('A: エラー ' + e.message);
  }
});

/* ── B: cancel なしで発話 ───────────────── */
function speakTest(useCancel, tag) {
  if (useCancel) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('てすと');
  u.lang = 'ja-JP';
  u.rate = 0.85;
  const voices = speechSynthesis.getVoices();
  const ja = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang && v.lang.startsWith('ja'));
  if (ja) u.voice = ja;
  log(tag + ': speak要求 voice=' + (ja ? ja.name : 'なし(既定)'));
  u.onstart = () => log(tag + ': onstart 発火（発声が始まった）');
  u.onend   = () => log(tag + ': onend 発火');
  u.onerror = (e) => log(tag + ': onerror ' + (e.error || '不明'));
  speechSynthesis.speak(u);
  setTimeout(() => log(tag + ': 0.5秒後 speaking=' + speechSynthesis.speaking + ' pending=' + speechSynthesis.pending), 500);
}

document.getElementById('btnPlain').addEventListener('click', () => speakTest(false, 'B'));
document.getElementById('btnCancel').addEventListener('click', () => speakTest(true, 'C'));

/* ── D/E/F: どの操作イベントなら発話が通るか ─── */
document.getElementById('btnPointer').addEventListener('pointerdown', () => speakTest(true, 'D(pointerdown)'));
document.getElementById('btnClick').addEventListener('click', () => speakTest(true, 'E(click)'));
document.getElementById('btnTouchend').addEventListener('touchend', () => speakTest(true, 'F(touchend)'));
</script>

</body>
</html>
